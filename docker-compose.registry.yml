services:
  db:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - mongo_data:/data/db
    networks:
      - tienda_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  backend:
    image: ghcr.io/josedlpena3/tienda-tp2-backend:v0.1.0
    restart: unless-stopped
    environment:
      PORT: 8080
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@db:27017/${MONGO_DB_NAME}?authSource=admin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tienda_net
  frontend:
    image: ghcr.io/josedlpena3/tienda-tp2-frontend:v0.1.0
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    networks:
      - tienda_net
networks:
  tienda_net:
    driver: bridge
volumes:
  mongo_data:
