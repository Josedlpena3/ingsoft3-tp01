server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, needed so nginx re-resolves the "backend"
    # service name instead of caching it (or failing to start if the
    # backend container isn't up yet).
    resolver 127.0.0.11 valid=30s;

    # Serve the React SPA, falling back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend service. No trailing slash on
    # proxy_pass so /api/tutorials is forwarded as-is (a trailing slash
    # would strip the /api prefix before reaching Express).
    location /api/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
